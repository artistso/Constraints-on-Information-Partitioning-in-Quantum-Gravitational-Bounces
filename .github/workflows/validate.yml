name: Validate mathematics, physics, and claim language

on:
  push:
    branches:
      - main
      - proposal/**
  pull_request:

permissions:
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public scientific language
        run: python scripts/check_claim_language.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Run non-optimization regression tests
        run: pytest -m "not optimization"
      - name: Generate isometry and gravity outputs
        run: python scripts/run_stress_tests.py --samples 250
      - name: Generate channel and remnant outputs
        run: python scripts/run_channel_stress_tests.py --samples 250
      - name: Generate HRS geometry outputs
        run: python scripts/run_geometry_stress_tests.py
      - name: Generate charge-sector outputs
        run: python scripts/run_symmetry_stress_tests.py

  optimization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned optimization environment
        run: python -m pip install -e ".[test,optimization]"
      - name: Run certified SDP tests
        shell: bash
        run: |
          set -o pipefail
          pytest -m optimization -vv 2>&1 | tee optimization-test.log
      - name: Generate theorem-grade optimization outputs
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_theorem_stress_tests.py 2>&1 | tee theorem-stress-test.log
      - name: Upload optimization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimization-diagnostics
          path: |
            optimization-test.log
            theorem-stress-test.log
            outputs/theorem_stress_tests/
          if-no-files-found: warn
