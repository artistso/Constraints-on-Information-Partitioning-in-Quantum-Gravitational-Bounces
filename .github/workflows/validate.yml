name: Validate mathematics and physical scales

on:
  push:
    branches:
      - main
      - proposal/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Run regression tests
        run: pytest
      - name: Generate deterministic stress-test outputs
        run: python scripts/run_stress_tests.py --samples 250
