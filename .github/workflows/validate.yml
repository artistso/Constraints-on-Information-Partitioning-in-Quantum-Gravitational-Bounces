name: Validate mathematics and physical scales

on:
  push:
    branches:
      - main
      - proposal/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Run non-optimization regression tests
        run: pytest -m "not optimization"
      - name: Generate isometry and gravity outputs
        run: python scripts/run_stress_tests.py --samples 250
      - name: Generate channel and remnant outputs
        run: python scripts/run_channel_stress_tests.py --samples 250

  optimization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned optimization environment
        run: python -m pip install -e ".[test,optimization]"
      - name: Run certified SDP tests
        run: pytest -m optimization
      - name: Generate theorem-grade optimization outputs
        run: python scripts/run_theorem_stress_tests.py
