[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qgbounce"
version = "0.4.0"
description = "Validation simulations for information localization and recovery in quantum-gravitational bounce models"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
optimization = [
  "cvxpy==1.9.2",
  "clarabel==0.11.1",
  "scs==3.2.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "optimization: tests requiring the pinned CVXPY/Clarabel/SCS optimization extra",
]
